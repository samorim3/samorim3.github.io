name: Weekly Health Contests & Telegram Alerts

on:
  schedule:
    # Runs every Sunday at 13:44 UTC and 14:44 UTC.
    # Combined with --schedule-check in the script, only the run that
    # falls at 14h Lisbon time actually executes (handles DST automatically).
    - cron: '44 13,14 * * 0'
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

jobs:
  check-contests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run SPMS contests monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python check_health_contests.py --schedule-check
