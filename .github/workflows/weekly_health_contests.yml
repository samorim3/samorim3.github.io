name: Weekly Health Contests & Telegram Alerts

on:
  schedule:
    # Runs every Sunday at 13:44 UTC and 14:44 UTC.
    # Combined with --schedule-check, only the run that falls at 14h Lisbon time executes.
    - cron: '44 13,14 * * 0'
  workflow_dispatch: # Allow manual trigger anytime from GitHub Actions tab

jobs:
  check-contests:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run health contests monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Triggered by cron schedule: applying --schedule-check"
            python check_health_contests.py --schedule-check
          else
            echo "Triggered manually: running full check immediately"
            python check_health_contests.py
          fi
