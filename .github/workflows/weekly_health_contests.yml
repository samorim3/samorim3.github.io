name: Weekly Health Contests & Telegram Alerts

on:
  schedule:
    # Run every Sunday at 13:44 and 14:44 UTC
    # Combined with --schedule-check, this guarantees execution exactly at 14:44 Lisbon time
    # both during Standard Time (UTC+0, winter) and Daylight Saving Time (UTC+1, summer).
    - cron: '44 13,14 * * 0'
  workflow_dispatch: # Allows manual run at any time from the GitHub Actions tab

permissions:
  contents: write

jobs:
  check-contests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 urllib3

      - name: Run health contests monitor & alert system
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python check_health_contests.py --schedule-check

      - name: Commit and push updated contests state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add concursos_state.json
          git commit -m "Auto-update health contests state [skip ci]" || echo "No changes to commit"
          git push origin main || echo "No changes to push"
