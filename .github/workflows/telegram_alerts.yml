name: Automated Telegram Price Alerts

on:
  schedule:
    # Runs hourly from 08:00 to 21:00 UTC Monday through Friday
    - cron: '0 8-21 * * 1-5'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

concurrency:
  group: telegram-alerts
  cancel-in-progress: true

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests

      - name: Run Price Alert Check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python check_alerts.py

