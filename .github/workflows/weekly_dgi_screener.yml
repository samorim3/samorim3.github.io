name: Weekly Western DGI Market Screener

on:
  schedule:
    # Run every Sunday at 21:00 UTC (markets closed, before Monday opening)
    - cron: '0 21 * * 0'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

permissions:
  contents: write

jobs:
  run-dgi-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 yfinance pandas lxml

      - name: Run Global DGI Screener (~1,000 stocks)
        run: |
          python dgi_screener.py

      - name: Commit and push updated DGI rankings
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dgi_market_ranking.json dgi_universe.json
          git commit -m "Auto-update weekly DGI market rankings [skip ci]" || echo "No changes to commit"
          git push origin main || echo "No changes to push"
